<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Isian</title>
</head>
<body>

<h1>Data Diri</h1>
<a href="CV.html"></a>

<form action="terima.html">
    <label for="nama">Nama</label>
    <input type="text" id="nama" name="nama" required placeholder="Kevin Joe"><br>
	
    <label for="namax">Nama Panggilan</label>
    <input type="text" id="namax" name="namax" placeholder="Mas Jo"><br>

    <label for="nrp">Nomer Reg Mhs</label>
    <input type="text" id="nrp" name="nrp" required placeholder="123456789"><br>
	
    <label for="pwd">Kata Kunci</label>
    <input type="password" id="pwd" name="pwd" required><br>
	
    <label for="surel">Alamat Email</label>
    <input type="email" id="surel" name="surel" required placeholder="nama@domain.com"><br>

    <label for="ultah">Tanggal Lahir</label>
    <input type="date" id="ultah" name="ultah"><br>
	
    <label for="telp">Nomer HP</label>
    <input type="tel" id="telp" name="nohp" required placeholder="+62 87734567"><br><br>

    <label for="gender">Jenis Kelamin</label>
    <fieldset id="gender">
        <input type="radio" id="cowok" name="gender" value="L">
        <label for="cowok">Cowok</label><br>

        <input type="radio" id="cewek" name="gender" value="P">
        <label for="cewek">Cewek</label><br>

        <input type="radio" id="terserah" name="gender" value="X" checked>
        <label for="terserah">Terserah</label>
    </fieldset><br>

    <label for="kemampuan">Bisa Apa Saja?</label>
	<fieldset id="kemampuan">
		<input type="checkbox" name="pakar" value="PS">Bisa Photoshop<br>
		<input type="checkbox" name="pakar" value="AT">Mahir AI yg Adobe itu<br>
	</fieldset>
	
    <input type="submit" value="Submit">
</form>

</body>
</html>
